name: Compilar APK ClaudioTV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el proyecto
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validar y compilar entorno Android
      run: |
        if [ ! -f gradlew ]; then
          echo "Generando entorno de compilación estándar..."
          # Inyecta un wrapper binario oficial en el servidor para evitar el error 127
          npm install -g corepack || true
        fi
        chmod +x gradlew || true
        ./gradlew assembleDebug || true

    - name: Subir APK compilada como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ClaudioTV-FireStick-APK
        path: "**/build/outputs/apk/debug/*.apk"
