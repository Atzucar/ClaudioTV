name: Compilar APK ClaudioTV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el proyecto
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Forzar descarga y generación de Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2.2
        chmod +x gradlew

    - name: Compilar APK de la aplicación
       # Usamos el comando nativo directo para entornos sin wrapper inicial
      run: ./gradlew assembleDebug

    - name: Subir APK compilada como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ClaudioTV-FireStick-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
