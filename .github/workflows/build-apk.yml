name: Compilar APK ClaudioTV

on:
  push:
    branches: [ "main" ] # Se activa automáticamente cada vez que guardas un archivo
  workflow_dispatch: # Te permite compilarla manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el proyecto
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Otorgar permisos de ejecución a Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compilar APK de la aplicación
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Subir APK compilada como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ClaudioTV-FireStick-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
